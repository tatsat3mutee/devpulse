name: Prepare daily edition

on:
  schedule:
    - cron: '17 7 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      edition_date:
        description: Edition date in YYYY-MM-DD; defaults to today in Asia/Kolkata
        required: false
        type: string
      collect_only:
        description: Collect candidates and source health without model calls or a review PR
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: edition-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COLLECT_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.collect_only) || (github.event_name != 'workflow_dispatch' && vars.EDITORIAL_DRAFTS_ENABLED != 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Test source collection offline
        run: bun test ./tests/sources.test.ts
      - name: Resolve edition date
        id: date
        shell: bash
        env:
          REQUESTED_EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          date_value="$REQUESTED_EDITION_DATE"
          if [[ -z "$date_value" ]]; then
            date_value="$(TZ=Asia/Kolkata date +%F)"
          fi
          EDITION_DATE="$date_value" bun -e 'import { validateEditionDate } from "./scripts/lib/sources.ts"; validateEditionDate(process.env.EDITION_DATE);'
          echo "value=$date_value" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate edition or review
        if: env.COLLECT_ONLY != 'true'
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ steps.date.outputs.value }}
        run: |
          if [[ -f "data/editions/$EDITION_DATE.json" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Edition already published."
            exit 0
          fi
          if gh pr list --state open --search "Edition review: $EDITION_DATE in:title" --json number --jq 'length' | grep -vq '^0$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Review pull request already exists."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Collect candidates without a model
        if: env.COLLECT_ONLY == 'true'
        run: bun run edition:prepare --dry-run
        env:
          EDITION_DATE: ${{ steps.date.outputs.value }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare verified draft
        if: env.COLLECT_ONLY != 'true' && steps.guard.outputs.skip != 'true'
        run: bun run edition:prepare
        env:
          EDITION_DATE: ${{ steps.date.outputs.value }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'google/gemini-2.5-flash' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain candidates and source health
        if: always() && steps.date.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edition-collection-${{ steps.date.outputs.value }}-${{ github.run_id }}
          path: data/collection/${{ steps.date.outputs.value }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate draft build
        if: env.COLLECT_ONLY != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          bun test ./tests
          bun run build
      - name: Open editorial review pull request
        if: env.COLLECT_ONLY != 'true' && steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_DATE: ${{ steps.date.outputs.value }}
        run: |
          branch="edition/$EDITION_DATE-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "data/review/$EDITION_DATE.json"
          git commit -m "content(edition): prepare $EDITION_DATE review"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Edition review: $EDITION_DATE" \
            --body "$(printf '%s\n' \
              '## Editorial gate' \
              '' \
              'Review every claim, quote, confidence label and counterpoint against its primary source.' \
              'Mark provenance.humanReviewed true on each story only after review.' \
              '' \
              "Run: bun run edition:publish $EDITION_DATE" \
              '' \
              'Commit the published file to this pull request. Merging is the publication decision.')"
              gh workflow run verify-and-publish.yml --ref "$branch"
