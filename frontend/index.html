<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DevPulse - AI developer signal feed</title>
    <meta name="description" content="DevPulse - a quiet feed of what actually matters in AI. Papers, repos, releases, and reading, curated daily." />
    <meta name="theme-color" content="#0c0e12" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevPulse" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devpulse-q71w.onrender.com/" />
    <meta property="og:title" content="DevPulse - AI developer signal feed" />
    <meta property="og:description" content="arXiv papers, GitHub trending, HN threads, Hugging Face drops - ranked by real signal, not clicks." />
    <meta property="og:image" content="https://devpulse-q71w.onrender.com/og-image.svg" />
    <meta property="og:site_name" content="DevPulse" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevPulse - AI developer signal feed" />
    <meta name="twitter:description" content="arXiv papers, GitHub trending, HN threads, Hugging Face drops - ranked by real signal, not clicks." />
    <meta name="twitter:image" content="https://devpulse-q71w.onrender.com/og-image.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function(){
        var t=localStorage.getItem('theme');
        if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))
          document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
