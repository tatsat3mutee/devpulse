<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C0E12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d23;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34C78D" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo -->
  <g transform="translate(150, 150)">
    <rect width="180" height="180" rx="40" fill="#0C0E12" stroke="#34C78D" stroke-width="2"/>
    <g stroke="#34C78D" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 30 90 L 60 90 L 80 40 L 105 130 L 125 70 L 150 90"/>
    </g>
  </g>
  
  <!-- Main text -->
  <text x="400" y="200" font-family="Inter, sans-serif" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-2">DevPulse</text>
  
  <!-- Tagline -->
  <text x="400" y="280" font-family="Inter, sans-serif" font-size="40" font-weight="400" fill="#34C78D">One AI idea, twice a week</text>
  
  <!-- Description -->
  <text x="400" y="360" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#999999">One mechanism • The number • Ten minutes</text>
  
  <!-- Bottom accent -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#34C78D" stroke-width="3" opacity="0.5"/>
</svg>